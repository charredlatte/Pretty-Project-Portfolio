<title>The Catio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:ital,wght@0,500;0,700;0,800;1,500&display=swap">
<style>
/* Layout: the catio is the whole screen, in a Sprout Lands frame. Nothing else shows until you hover
   a room or a cat; then one menu panel opens beside it. A small sign in the corner says whether the
   cats are live, and spells out any fix. Every panel, button, field, bubble, face and pointer is cut
   from Cup Nooble's Sprout Lands UI pack (art/licensed/ui/) and drawn at whole-pixel scale; titles
   and buttons use its pixel font. Dark mode turns the meadow to night. */
@font-face { font-family: "Sprout"; src: url(art/licensed/ui/sprout.ttf) format("truetype"); font-display: swap; }
:root {
  --ink: #3F2A20;          /* dark cocoa: the Sprout panels' outline, deepened for reading */
  --ink-soft: #654535;
  --tan: #DCB98A;          /* the panel's face */
  --cream: #E8CFA6;
  --pixel: "Sprout", "Fredoka", ui-rounded, system-ui, sans-serif;   /* 18px draws the pack's font one pixel to a pixel */
  --display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --night: rgba(8, 20, 34, 0);
  --scene: none;
  --u: 2px;                /* one art pixel on screen */
  --paw: url(art/licensed/ui/cursor.png) 9 5, default;
  --point: url(art/licensed/ui/cursor-point.png) 9 3, pointer;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --night: rgba(8, 20, 34, .62); --scene: brightness(.7) saturate(.85) hue-rotate(-12deg); }
}
:root[data-theme="dark"] { --night: rgba(8, 20, 34, .62); --scene: brightness(.7) saturate(.85) hue-rotate(-12deg); }
@media (max-width: 560px) { :root { --u: 1px; } }

* { box-sizing: border-box; }
html, body { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; overflow: hidden; color: var(--ink); font: 500 0.95rem/1.5 var(--body); background: #5E8F34; image-rendering: pixelated; cursor: var(--paw); }
.screen { position: fixed; inset: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button, a, select, summary, label:has(input[type="radio"]) { cursor: var(--point); }
a { color: var(--ink); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.px { image-rendering: pixelated; background-repeat: no-repeat; }

/* the Sprout Lands pieces, each a 9-slice scaled by --u. The plain colour under each is the piece's
   own face: the art paints over it, and a copy without the licensed art is still readable. */
.menu, dialog, .hud, .toast, .stage-msg {
  border: calc(6 * var(--u)) solid transparent; border-image: url(art/licensed/ui/panel.png) 6 fill / calc(6 * var(--u)) stretch; background: var(--tan) padding-box; image-rendering: pixelated; }
.btn { font: 18px/22px var(--pixel); color: var(--ink); padding: 0 calc(2 * var(--u)); text-decoration: none; display: inline-block; background: var(--cream) padding-box; white-space: nowrap;
  border-style: solid; border-color: transparent; border-width: calc(4 * var(--u)) calc(4 * var(--u)) calc(6 * var(--u));
  border-image: url(art/licensed/ui/button.png) 4 4 6 4 fill / calc(4 * var(--u)) calc(4 * var(--u)) calc(6 * var(--u)) stretch; }
.btn:hover { border-image-source: url(art/licensed/ui/button-hover.png); }
.btn.green { border-image-source: url(art/licensed/ui/button-green.png); background-color: #C0D470; }
.btn.pink { border-image-source: url(art/licensed/ui/button-pink.png); background-color: #EBB7AE; }
.btn.green:hover, .btn.pink:hover { filter: brightness(1.06); }
.btn:active { border-image: url(art/licensed/ui/button-down.png) 4 fill / calc(4 * var(--u)) stretch; translate: 0 calc(2 * var(--u)); filter: none; }
.field input, .field select, .field textarea { border: calc(4 * var(--u)) solid transparent; border-image: url(art/licensed/ui/field.png) 4 4 5 4 fill / calc(4 * var(--u)) calc(4 * var(--u)) calc(5 * var(--u)) stretch;
  background: #C1C8B9 padding-box; padding: 1px 4px; width: 100%; min-width: 0; image-rendering: pixelated; }
.field select { appearance: none; -webkit-appearance: none; padding-right: calc(14 * var(--u)); border-image-slice: 4 4 5 4;   /* no fill: the arrow is a background, under the frame */
  background: url(art/licensed/ui/arrow.png) right calc(2 * var(--u)) center / calc(10 * var(--u)) calc(9 * var(--u)) no-repeat, #C1C8B9 padding-box; }
.field input::placeholder, .field textarea::placeholder { color: #5F6A5E; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
/* a divider: the pack's underline, capped at both ends */
.rule, .bar { border-top: calc(4 * var(--u)) solid transparent; border-image: url(art/licensed/ui/divider.png) 4 1 0 1 / calc(4 * var(--u)) var(--u) 0 var(--u) stretch; }

/* the mood faces: the pack's cat emoji, one 32 px cell per mood (--f follows MOODS: cry, meow, box, idle, sleep; then a queen's heart eyes) */
.face-ico { --f: 3; display: inline-block; flex: none; width: 30px; height: 30px; image-rendering: pixelated;
  background: url(art/licensed/ui/faces.png) calc(var(--f) * -32px - 1px) -1px / 192px 32px no-repeat; }
.fail > .face-ico, .fail .face { --f: 0; }
.need > .face-ico, .need .face { --f: 1; }
.gift > .face-ico, .gift .face { --f: 2; }
.sleep > .face-ico, .sleep .face { --f: 4; }
.queenb .face, .queenb > .face-ico { --f: 5; }

/* the sign: the live tick, or the warning cross */
.status { font-size: .8rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.status.warn { color: var(--ink); font-weight: 700; }
.status .words { flex: 1 1 200px; min-width: 0; }
.status .dot { width: 12px; height: 12px; flex: none; align-self: flex-start; margin-top: 4px; display: inline-block; background: url(art/licensed/ui/status.png) 0 0 / 24px 12px no-repeat; }
.status.warn .dot { background-position: -12px 0; }
.status .dot.wait { opacity: .45; }

/* the stage: the whole screen, the meadow tiled to follow the camera, the frame laid over the edge */
.stage { position: absolute; inset: 0; overflow: clip; touch-action: manipulation; background: #8FBF4F; }
.meadow { position: absolute; inset: 0; background: url(art/licensed/meadow.png) repeat; image-rendering: pixelated; filter: var(--scene);
  transition: background-size .55s cubic-bezier(.3,.7,.2,1), background-position .55s cubic-bezier(.3,.7,.2,1); }
.stage.instant .meadow { transition: none; }
.trim { position: fixed; inset: 0; pointer-events: none; z-index: 30; border: calc(6 * var(--u)) solid transparent; border-image: url(art/licensed/ui/panel.png) 6 / calc(6 * var(--u)) stretch; }
.hud { position: fixed; z-index: 31; top: calc(6 * var(--u) + 8px + env(safe-area-inset-top, 0px)); left: calc(6 * var(--u) + 8px); max-width: min(520px, calc(100vw - 12 * var(--u) - 16px));
  padding: 0 calc(2 * var(--u)); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.hud .status.warn, .hud:hover .status, .hud:focus-within .status { flex-basis: 100%; }
.hud h1 { margin: 0; font: 18px/22px var(--pixel); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.hud h1 span { font: 800 .78rem var(--body); color: var(--ink-soft); }
.hud .status:not(.warn) .words { display: none; }
.hud:hover .status .words, .hud:focus-within .status .words { display: inline; }
.credits { position: fixed; z-index: 19; right: calc(6 * var(--u) + 8px); bottom: calc(6 * var(--u) + 4px + env(safe-area-inset-bottom, 0px)); margin: 0; font-size: .66rem; color: #FFF8EA; opacity: .9;
  text-shadow: 0 1px 0 #2C4A18, 1px 0 0 #2C4A18, -1px 0 0 #2C4A18, 0 -1px 0 #2C4A18; max-width: calc(100vw - 12 * var(--u) - 16px); text-align: right; }
.world { position: absolute; left: 0; top: 0; width: 1280px; height: 896px; transform-origin: 0 0; transition: transform .55s cubic-bezier(.3,.7,.2,1);
  background: url(art/licensed/meadow.png) 0 0 / 224px 64px repeat; image-rendering: pixelated; filter: var(--scene); }
.stage.instant .world { transition: none; }
.house { position: absolute; inset: 0; width: 1280px; height: 896px; max-width: none; image-rendering: pixelated; user-select: none; -webkit-user-drag: none; }
.prop { position: absolute; pointer-events: none; }
/* rooms, cabinets and cats light up with the pack's white selection brackets: a room under the pointer,
   with keyboard focus, or whose menu is open. A room's brackets keep one size on screen at any zoom
   (--cs is the camera scale). */
.roomhit, .cabinet, .cat { position: absolute; background: transparent; border: 0; padding: 0; cursor: var(--point); }
.roomhit { --by: calc(var(--u) * 9 / var(--cs, 1)); --bx: calc(var(--u) * 8 / var(--cs, 1)); }
.roomhit:hover, .roomhit.lit, .roomhit:focus-visible { background: rgba(255, 250, 225, .12); outline: 0; border: 0 solid transparent;
  border-image: url(art/licensed/ui/corners.png) 9 8 / var(--by) var(--bx) stretch; }
.roomhit.here { cursor: var(--paw); background: transparent; border: 0; }
.roomhit.here:focus-visible { border-style: solid; }
.cabinet:hover, .cabinet:focus-visible, .cat:focus-visible { outline: 0; border: 9px solid transparent; border-image: url(art/licensed/ui/corners.png) 9 8 / 9px 8px stretch; border-image-outset: 5px; }
.cat:focus-visible { border-width: 0; }
.spr { display: inline-block; vertical-align: bottom; filter: var(--tint, none); image-rendering: pixelated; background-repeat: no-repeat; }
.cat .spr { display: block; }
.emb { position: absolute; width: 20px; height: 24px; pointer-events: none; image-rendering: pixelated;
  background: url(art/licensed/emblems.png) calc(var(--e) * -20px) 0 / 120px 24px no-repeat; }
.emb.corner { left: auto; top: auto; right: 0; bottom: 0; }
.emb.big { transform: scale(2); transform-origin: 100% 100%; right: 6px; bottom: 4px; }
.tag.files { pointer-events: auto; cursor: var(--point); transform: translate(-50%, -100%); }
/* a count: the pack's white button at one pixel a pixel */
.pile-n, .tag .n { font: 800 11px/1 var(--body); color: var(--ink); padding: 0 1px;
  border-style: solid; border-color: transparent; border-width: 3px 3px 5px; border-image: url(art/licensed/ui/button-hover.png) 4 4 6 4 fill / 3px 3px 5px stretch; }
.pile-n { position: absolute; right: -6px; top: 4px; }
/* a queen's crown: the pack's crown icon, gilded */
.cat .crown, .crown { position: absolute; width: 14px; height: 13px; pointer-events: none; image-rendering: pixelated; background: url(art/licensed/ui/crown.png) no-repeat; }
.crown.inline { position: static; display: inline-block; flex: none; }
.crown.corner { right: 8px; bottom: 8px; transform: scale(2); transform-origin: 100% 100%; }
/* what a queen keeps: a brown star each, gold for the one she says */
ul.keeps { list-style: none; margin: 2px 0 6px; padding: 0; display: flex; flex-direction: column; gap: 5px; }
ul.keeps .kept { display: flex; align-items: center; gap: 6px; font-size: .88rem; }
ul.keeps .kept .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
ul.keeps .dot { flex: none; width: 10px; height: 8px; image-rendering: pixelated; background: url(art/licensed/ui/stars.png) -10px 0 / 20px 8px no-repeat; }
ul.keeps .pin { font-weight: 700; }
ul.keeps .pin .dot { background-position: 0 0; }
.btn.tiny { border-width: 4px 4px 6px; border-image-width: 4px 4px 6px; padding: 0 2px; }
.btn.tiny:active { border-image-width: 4px; translate: 0 2px; }
.queen-line { margin-top: 2px; }
.dlg > p.sub { margin: 0; font: 18px/22px var(--pixel); }

/* sprite sheets: one step() animation per mood */
.s-idle  { width: 32px; height: 32px; background-image: url(art/licensed/mochi-idle.png); animation: a-idle 1.25s steps(10) infinite; }
.s-box   { width: 32px; height: 32px; background-image: url(art/licensed/mochi-box.png); animation: a-box .8s steps(4) infinite; }
.s-cry   { width: 64px; height: 64px; background-image: url(art/licensed/pochi.png); background-position: 0 0; animation: a-cry .7s steps(4) infinite; }
.s-meow  { width: 64px; height: 64px; background-image: url(art/licensed/pochi.png); background-position: 0 -64px; animation: a-meow .5s steps(2) infinite; }
.s-sleep { width: 64px; height: 64px; background-image: url(art/licensed/pochi.png); background-position: 0 -128px; animation: a-sleep 2.4s steps(4) infinite; }
@keyframes a-idle  { from { background-position: 0 0; } to { background-position: -320px 0; } }
@keyframes a-box   { from { background-position: 0 0; } to { background-position: -128px 0; } }
@keyframes a-cry   { from { background-position: 0 0; } to { background-position: -256px 0; } }
@keyframes a-meow  { from { background-position: 0 -64px; } to { background-position: -128px -64px; } }
@keyframes a-sleep { from { background-position: 0 -128px; } to { background-position: -256px -128px; } }
.cat.m-meow { animation: hop 1s steps(2) infinite; }
@keyframes hop { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3px; } }

/* overlay: speech bubbles and room names, drawn at screen size (one art pixel a pixel) */
.overlay { position: absolute; inset: 0; pointer-events: none; transition: opacity .15s; }
.overlay.moving { opacity: 0; }
.tag { position: absolute; font: 18px/18px var(--pixel); padding: 0 2px; white-space: nowrap; display: flex; gap: 5px; align-items: center; color: var(--ink); background: var(--cream) padding-box;
  border-style: solid; border-color: transparent; border-width: 4px 4px 6px; border-image: url(art/licensed/ui/button.png) 4 4 6 4 fill / 4px 4px 6px stretch; image-rendering: pixelated; }
/* a sign on each room's back wall: its name, cut to the room's width, and a badge (the mood's face and a
   count) when cats in it need you */
.sign { pointer-events: none; gap: 2px; }
.sign .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.badge { flex: none; display: inline-flex; align-items: center; gap: 0; }
.badge .face-ico { margin: -7px -2px -7px 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.bub { position: absolute; pointer-events: auto; transform: translate(-50%, -100%); cursor: var(--point); color: var(--ink); padding: 0 2px 1px; font: 500 12.5px/1.3 var(--body);
  max-width: 200px; width: max-content; text-align: left; background: #DCE0D2 padding-box;
  border-style: solid; border-color: transparent; border-width: 5px 5px 6px; border-image: url(art/licensed/ui/bubble.png) 5 5 6 5 fill / 5px 5px 6px stretch; image-rendering: pixelated; }
.bub::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 11px; height: 9px; margin-left: -5px; background: url(art/licensed/ui/bubble-tail.png) no-repeat; }
.bub.below { transform: translate(-50%, 0); }
.bub.below::after { bottom: auto; top: -10px; transform: scaleY(-1); }
.bub b { display: flex; align-items: center; gap: 4px; font: 18px/22px var(--pixel); margin: 0 0 1px; font-weight: normal; }
.bub b .face-ico { margin: -2px 0 -3px -2px; }
.bub .t { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bub.icon { padding: 0; border: 0; border-image: none; width: auto; background: none; }
.bub.icon::after { display: none; }
.bub.icon .face { display: block; }
.stage-msg { position: absolute; left: 50%; bottom: calc(6 * var(--u) + 10px); transform: translateX(-50%); font-size: .85rem; padding: 0 6px; max-width: calc(100% - 24px); text-align: center; }

/* the hover menu: a panel beside the room or cat you're pointing at */
.menu { position: absolute; z-index: 20; width: min(310px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; display: grid; gap: 8px; color: var(--ink); padding: 2px calc(2 * var(--u)) calc(2 * var(--u)); }
.menu h3 { margin: 0; font: 18px/22px var(--pixel); display: flex; gap: 6px; align-items: center; overflow-wrap: anywhere; }
.menu h3 .emb { position: static; flex: none; }
.menu .sub { margin: -4px 0 0; font-size: .8rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.menu .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.menu .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .78rem; color: var(--ink-soft); padding-top: 6px; }
.menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.menu .mini { display: flex; gap: 6px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 0; font-size: .82rem; }
.menu .mini b { font: 18px/22px var(--pixel); font-weight: normal; }
.menu .mini:hover span:last-child { text-decoration: underline; }
.menu .moods { display: flex; gap: 4px; flex-wrap: wrap; }
.menu .keys { margin: 0; font-size: .75rem; color: var(--ink-soft); }
.menu .moods .btn[aria-pressed="true"] { border-image-source: url(art/licensed/ui/button-green.png); }
/* the sound switch: the pack's toggle, off or on */
.sound { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; font: 18px/22px var(--pixel); color: var(--ink); }
.sound .switch { width: 28px; height: 18px; flex: none; background: url(art/licensed/ui/toggle.png) 0 0 / 56px 18px no-repeat; }
.sound .switch.on { background-position: -28px 0; }
.item { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; height: 100%; text-align: left; color: inherit;
  background: var(--cream) padding-box; padding: 0 34px 0 0; border-style: solid; border-color: transparent; border-width: calc(4 * var(--u)) calc(4 * var(--u)) calc(6 * var(--u));
  border-image: url(art/licensed/ui/button.png) 4 4 6 4 fill / calc(4 * var(--u)) calc(4 * var(--u)) calc(6 * var(--u)) stretch; image-rendering: pixelated; }
.item:hover { border-image-source: url(art/licensed/ui/button-hover.png); }
.item > .face-ico { position: absolute; right: 0; top: 0; }
.item .thumb { width: 48px; height: 48px; position: relative; overflow: hidden; background: url(art/licensed/meadow.png) 0 0 / 112px 32px; }
.thumb .spr, .portrait .spr { position: absolute; left: 50%; bottom: 0; transform-origin: 50% 100%; }
.item .thumb .spr { transform: translateX(-50%) scale(.72); }
.item .thumb .spr.s-idle, .item .thumb .spr.s-box { transform: translateX(-50%) scale(1.4); }
.item .who { font: 18px/22px var(--pixel); }
.item .what { font-size: .8rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.item .ask { margin-top: 3px; overflow-wrap: anywhere; }
.empty { font-size: .9rem; color: var(--ink-soft); margin: 0; }

/* dialogs: a panel over the dimmed cabin */
dialog { padding: calc(2 * var(--u)) calc(4 * var(--u)); width: min(500px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); color: var(--ink); overflow: auto; }
dialog::backdrop { background: rgba(18, 36, 20, .55); }
.dlg { padding: 4px 2px; display: grid; gap: 12px; }
.dlg h2 { font: 36px/44px var(--pixel); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.dlg h2.long { font-size: 18px; line-height: 24px; }
.dlg .head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: end; }
.portrait { width: calc(112px + 14 * var(--u)); height: calc(96px + 14 * var(--u)); position: relative; overflow: hidden; background: url(art/licensed/meadow.png) 0 0 / 224px 64px padding-box;
  border: calc(7 * var(--u)) solid transparent; border-image: url(art/licensed/ui/frame.png) 7 / calc(7 * var(--u)) stretch; }
.portrait .spr { bottom: 2px; transform: translateX(-50%) scale(1.4); }
.portrait .spr.s-idle, .portrait .spr.s-box { transform: translateX(-50%) scale(2.4); }
.mood { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; font-weight: 800; }
.ask-box { display: flex; gap: 8px; align-items: center; padding: 0 4px; overflow-wrap: anywhere; font-weight: 700; background: #DCE0D2 padding-box;
  border-style: solid; border-color: transparent; border-width: calc(5 * var(--u)) calc(5 * var(--u)) calc(6 * var(--u)); border-image: url(art/licensed/ui/bubble.png) 5 5 6 5 fill / calc(5 * var(--u)) calc(5 * var(--u)) calc(6 * var(--u)) stretch; }
div.ask-box:not(:has(.face-ico)) { font-weight: 600; }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: .9rem; }
dl.facts dt { color: var(--ink-soft); font-weight: 700; }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
.field { display: grid; gap: 2px; font-size: .9rem; }
.field > span { font: 18px/22px var(--pixel); }
.field input[type="radio"] { border: 0; border-image: none; width: auto; accent-color: #93B259; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.row > .field { flex: 1 1 160px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.actions .spacer { flex: 1; }
.note { font-size: .8rem; color: var(--ink-soft); margin: 0; }
/* the Rooms editor: the cabin cropped to the house in the pack's frame, each room a tab (brackets and a green
   sign when chosen, the arrow on the room new cats come in to), then the chosen room's card */
dialog.wide { width: min(600px, calc(100vw - 24px)); }
.plan { position: relative; box-sizing: content-box; aspect-ratio: 1168 / 672; overflow: clip; background: #8FBF4F padding-box;
  border: calc(7 * var(--u)) solid transparent; border-image: url(art/licensed/ui/frame.png) 7 / calc(7 * var(--u)) stretch; image-rendering: pixelated; }
.plan-art { position: absolute; left: -4.795%; top: -13.095%; width: 109.589%; height: 133.333%; filter: var(--scene); }
.plan-art img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.rt { position: absolute; padding: 0; background: transparent; border: 0 solid transparent; }
.rt:hover { background: rgba(255, 250, 225, .16); }
.rt[aria-selected="true"], .rt:focus-visible { outline: 0; background: rgba(255, 250, 225, .2);
  border-image: url(art/licensed/ui/corners.png) 9 8 / calc(9 * var(--u)) calc(8 * var(--u)) stretch; }

<script>
(() => {
  "use strict";
  const SERVER = "Claude Code Remote";
  const PAGE = 50;          // sessions per fetch
  const STALE_DAYS = 7;     // sleeping cats older than this go upstairs

  // Room geometry is fixed by the art, drawn to the plan in tools/cabin.py: native cabin pixels
  // (the scene draws them at 2x). r = [x, y, w, h]; spots = where cats sit, as the point under their feet;
  // cabinet = the filing cabinet's box, where that room's projects are kept.
  const GEOM = {
    garden:  { name: "Catio",       r: [448, 48, 160, 188], spots: [[474, 126], [514, 208], [568, 96], [586, 202]], cabinet: [457, 90, 22, 21], queen: [500, 110] },
    kitchen: { name: "Kitchen",     r: [32, 80, 85, 149],   spots: [[48, 212], [104, 146], [104, 212], [46, 146], [76, 202], [48, 180], [104, 180]], cabinet: [106, 105, 16, 27], queen: [76, 140] },
    dining:  { name: "Dining room", r: [112, 80, 101, 149], spots: [[124, 214], [200, 146], [200, 212]], cabinet: [186, 105, 16, 27], queen: [124, 130] },
    living:  { name: "Living room", r: [208, 48, 165, 181], spots: [[290, 162], [234, 212], [350, 206], [226, 118], [350, 150], [300, 216]], cabinet: [348, 72, 16, 27], queen: [268, 118] },
    sunroom: { name: "Sunroom",     r: [368, 80, 85, 149],  spots: [[426, 164], [392, 214]], queen: [398, 132] },
    study:   { name: "Craft room",  r: [272, 224, 165, 149], spots: [[300, 292], [352, 290], [396, 330], [322, 322], [420, 302], [292, 350], [346, 326], [366, 352], [392, 352], [316, 352], [370, 292], [296, 368], [336, 368], [376, 368]], cabinet: [414, 257, 16, 27], queen: [416, 366] },
    bedroom: { name: "Bedroom",     r: [96, 224, 117, 133], spots: [[122, 334], [198, 330], [140, 304]], cabinet: [103, 257, 16, 27], queen: [200, 300] },
    bath:    { name: "Bathroom",    r: [32, 224, 69, 117],  spots: [[62, 324]], queen: [90, 288] },
    hall:    { name: "Hall",        r: [208, 224, 69, 149], spots: [[246, 300]], queen: [252, 346] },
  };
  const ORDER = ["garden", "kitchen", "dining", "living", "sunroom", "study", "bedroom", "bath", "hall"];
  const WORLD = [640, 448];   // native size of the meadow
  const WHOLE = [0, 0, ...WORLD];

  // The room next door in each direction, from the boxes above: the nearest room whose centre lies
  // within 45° of that way (distance along it plus twice the sideways offset). Arrow keys use it.
  const NEXT = {};
  for (const a of ORDER) {
    const mid = (k) => { const [x, y, w, h] = GEOM[k].r; return [x + w / 2, y + h / 2]; };
    const [ax, ay] = mid(a);
    NEXT[a] = {};
    for (const [d, dx, dy] of [["ArrowLeft", -1, 0], ["ArrowRight", 1, 0], ["ArrowUp", 0, -1], ["ArrowDown", 0, 1]]) {
      let best = 0, score = Infinity;
      for (const b of ORDER) {
        const [bx, by] = mid(b);
        const along = (bx - ax) * dx + (by - ay) * dy, side = Math.abs((bx - ax) * dy + (by - ay) * dx);
        if (along > 0 && side <= along && along + 2 * side < score) { score = along + 2 * side; best = b; }
      }
      if (best) NEXT[a][d] = best;
    }
  }

  // Props from the Pochi sheet: [sx, sy, w, h] on the sheet, drawn with feet at native [x, y].
  const PROPS = [
    { s: [6, 256, 85, 175], at: [578, 222] },   // cat tree, catio
    { s: [9, 207, 43, 37], at: [60, 218] },     // food bowl, kitchen
    { s: [139, 208, 43, 37], at: [506, 122] },  // water bowl, catio deck
    { s: [216, 267, 33, 62], at: [104, 196] },  // food bag, by the fridge end of the island
    { s: [168, 407, 22, 20], at: [330, 316] },  // red yarn, on the craft-room worktable
    { s: [103, 405, 22, 20], at: [348, 320] },  // blue yarn, beside it
    { s: [103, 343, 18, 18], at: [362, 314] },  // a tin of buttons
    { s: [202, 412, 17, 15], at: [296, 176] },  // small red yarn, living-room rug
    { s: [137, 410, 17, 15], at: [410, 206] },  // small yarn, sunroom
  ];

  // Sprite per mood: frame size and the point under the feet within the frame.
  const SPR = {
    idle:  { cls: "s-idle",  w: 32, h: 32, ax: 12, ay: 32 },
    box:   { cls: "s-box",   w: 32, h: 32, ax: 16, ay: 32 },
    cry:   { cls: "s-cry",   w: 64, h: 64, ax: 32, ay: 64 },
    meow:  { cls: "s-meow",  w: 64, h: 64, ax: 25, ay: 64 },
    sleep: { cls: "s-sleep", w: 64, h: 64, ax: 32, ay: 64 },
  };
  const MOODS = {
    cry:   { rank: 0, label: "Upset: the last run failed", short: "Upset", kind: "fail", needs: true },
    meow:  { rank: 1, label: "Meowing for you", short: "Needs you", kind: "need", needs: true },
    box:   { rank: 2, label: "Brought you something to review", short: "To review", kind: "gift", needs: true },
    idle:  { rank: 3, label: "Busy working", short: "Working", kind: "work", needs: false },
    sleep: { rank: 4, label: "Asleep: nothing to do", short: "Asleep", kind: "sleep", needs: false },
  };
  const NAMES = ["Praline", "Noisette", "Biscotte", "Caramel", "Figue", "Brioche", "Madeleine", "Pistache", "Tartine", "Chouquette",
    "Galette", "Canelé", "Miso", "Yuzu", "Sésame", "Cannelle", "Muscade", "Olive", "Prune", "Myrtille", "Cerise", "Guimauve",
    "Nougat", "Réglisse", "Clafoutis", "Crumble", "Macaron", "Mirabelle", "Pomme", "Gaufre", "Tofu", "Matcha"];
  // Every room has one queen: she is not a session, she never leaves, and she keeps what matters
  // in that room. Older, statelier names than the working cats'.
  const QUEEN_NAMES = ["Mémé", "Duchesse", "Joséphine", "Colette", "Berthe", "Augustine", "Odette",
    "Simone", "Marguerite", "Hortense", "Célestine", "Philomène"];
  const NOTE_MAX = 160;     // one line she can hold in her head
  const NOTES_MAX = 12;     // more than this and nothing is important any more

  // A project's look: every cat of one project wears the same coat and carries the same emblem.
  const COATS = [
    { name: "Cream", f: "none" }, { name: "Ginger", f: "hue-rotate(-18deg) saturate(1.3)" }, { name: "Silver", f: "grayscale(1) brightness(1.05)" },
    { name: "Honey", f: "sepia(.5) saturate(1.4)" }, { name: "Blue-grey", f: "hue-rotate(180deg) saturate(.45) brightness(1.02)" },
    { name: "Shadow", f: "brightness(.62) saturate(.5)" }, { name: "Marmalade", f: "hue-rotate(20deg) saturate(1.7)" }, { name: "Smoke", f: "grayscale(.6) brightness(.8)" },
  ];
  // cells of art/licensed/emblems.png, in order; the first whose words match a project's name is its default
  const EMBLEMS = [
    { name: "Tin of cat food", words: /grocer|intermarch|meal|food|course|recipe|kitchen|cook/i },
    { name: "Coin", words: /shop|store|montfort|business|sales|price|money|plan|invoice|budget/i },
    { name: "Books", words: /law|legal|lease|contract|tenan|tax|admin|insurance|visa|research/i },
    { name: "Star", words: /portfolio|design|art|catio|pretty|brand/i },
    { name: "Potted plant", words: /garden|home|house|plant|health/i },
    { name: "Yarn", words: null },
  ];

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const hash = (s) => { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };

  const S = {
    sessions: null, sessionsAt: null, live: { state: "loading" },
    liveSessions: null, liveAt: null, copy: null, from: null,   // the live feed, and Claude's saved copy for when it's blocked
    rooms: {}, tweaks: {}, adopted: [], projects: {}, queens: {},
    focus: null, cursor: null, cam: null, sound: false, showOld: false, prevNeeding: null, art: "checking",
    db: null, mcp: null, perms: null, unwatch: null,
  };
  try { S.sound = localStorage.getItem("catio.sound") === "on"; S.showOld = localStorage.getItem("catio.showOld") === "on"; } catch (e) {}

  /* ---------- turning sessions into cats ---------- */
  const lower = (v) => String(v || "").toLowerCase();
  function repoOf(s) {
    const srcs = (s.session_context && s.session_context.sources) || [];
    for (const src of srcs) {
      const url = src && src.git_repository && src.git_repository.url;
      if (url) { const m = String(url).match(/github\.com\/([^/]+)\/([^/#?]+)/i); return m ? m[1] + "/" + m[2].replace(/\.git$/, "") : url; }
    }
    return "";
  }
  function branchOf(s) {
    const outs = (s.session_context && s.session_context.outcomes) || [];
    for (const o of outs) { const b = o && o.git_repository && o.git_repository.git_info && o.git_repository.git_info.branches; if (b && b[0]) return b[0]; }
    return "";
  }
  const ORIGINS = { android: "your phone", ios: "your phone", web_claude_ai: "the web", desktop_app: "the desktop app", cli: "a terminal" };

  function catFromSession(s) {
    const bucket = lower(s.status_bucket).replace("session_status_bucket_", "");
    const status = lower(s.session_status).replace("session_status_", "");
    const meta = s.external_metadata || {};
    const pts = s.post_turn_summary || meta.post_turn_summary || {};
    let mood = "sleep";
    if (bucket === "failed") mood = "cry";
    else if (bucket === "blocked") mood = "meow";
    else if (bucket === "working" || status === "running") mood = "idle";
    else if (pts.status_category === "need_input") mood = "meow";
    else if (bucket === "review_ready") mood = "box";
    const ask = pts.needs_action || pts.status_detail || (mood === "cry" ? "The last turn stopped with an error." : mood === "box" ? "Ready for you to look over." : "Waiting for your answer.");
    return {
      id: s.id, kind: "session", mood, archived: status === "archived",
      title: s.title || "Untitled session",
      ask: MOODS[mood].needs ? ask : "",
      doing: s.task_summary || meta.task_summary || pts.recent_action || pts.status_detail || "",
      repo: repoOf(s), branch: branchOf(s),
      origin: ORIGINS[s.origin] || s.origin || "",
      updated: Date.parse(s.updated_at || s.created_at) || 0,
      link: "https://claude.ai/code/" + encodeURIComponent(s.id),
    };
  }
  function catFromAdopted(d) {
    const mood = d.mood === "needs" ? "meow" : d.mood === "busy" ? "idle" : "sleep";
    return {
      id: "adopted:" + d.id, docId: d.id, kind: "chat", mood,
      title: d.title || "A chat", ask: mood === "meow" ? (d.note || "You marked this as needing you.") : "",
      doing: d.note || "", repo: "", branch: "", origin: "a chat on claude.ai",
      updated: d.updatedAt || d.adoptedAt || 0, link: d.link || "", room: d.room || "", nameOverride: d.name || "", projectName: d.project || "",
    };
  }

  const slug = (v) => lower(v).replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || "none";
  function projectOf(c) {
    const name = c.kind === "chat" ? (c.projectName || c.title) : c.repo ? c.repo.split("/").pop() : "No repository";
    return { key: slug(name), name, repo: c.kind === "session" ? c.repo : "" };
  }
  function lookOf(p) {
    const d = S.projects[p.key] || {};
    let emblem = EMBLEMS[d.emblem] ? d.emblem : EMBLEMS.findIndex((e) => e.words && e.words.test(p.name + " " + p.repo));
    if (emblem < 0) emblem = EMBLEMS.length - 1;
    return { emblem, coat: COATS[d.coat] ? d.coat : hash(p.key) % COATS.length };
  }

  // The queen of a room. Not a session and not adopted: she is always there, she is never counted
  // among the cats that need you, and what she keeps is the point of her.
  function queenOf(k) {
    const d = S.queens[k] || {};
    const notes = (Array.isArray(d.notes) ? d.notes : []).filter((n) => n && n.text);
    return {
      key: k,
      name: d.name || QUEEN_NAMES[hash("queen:" + k) % QUEEN_NAMES.length],
      notes: notes.slice().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.at || 0) - (a.at || 0)),
      pinned: notes.filter((n) => n.pinned),
      coat: COATS[hash("queen:" + k) % COATS.length].f,
    };
  }
  // She sits up when the room needs you, and speaks up when she is holding something for you.
  function queenMood(q, here) {
    if (q.pinned.length) return "meow";
    return here.some((c) => MOODS[c.mood].needs) ? "idle" : "sleep";
  }
  // The one line she gives you about her room, without your having to open anything.
  function queenLine(q, here) {
    if (q.pinned.length) return q.pinned[0].text;
    const need = here.filter((c) => MOODS[c.mood].needs);
    if (need.length === 1) return need[0].name + " needs you: " + (need[0].ask || need[0].title);
    if (need.length) return need.length + " cats need you in here.";
    if (here.length) return "All quiet \u2014 " + here.length + (here.length === 1 ? " cat" : " cats") + ", none needing you.";
    return "Nothing in this room just now.";
  }

  function roomInfo(key) {
    const d = S.rooms[key] || {};
    return { key, name: d.name || GEOM[key].name, blurb: d.blurb || "", repos: Array.isArray(d.repos) ? d.repos : [], catchAll: !!d.catchAll };
  }
  function catchAllRoom() { return ORDER.find((k) => S.rooms[k] && S.rooms[k].catchAll) || "living"; }
  function roomFor(cat) {
    const t = S.tweaks[cat.id];
    if (t && GEOM[t.room]) return t.room;
    if (cat.room && GEOM[cat.room]) return cat.room;
    const repo = lower(cat.repo), name = repo.split("/").pop();
    if (repo) for (const k of ORDER) {
      if (roomInfo(k).repos.some((r) => { r = lower(r).trim(); return r && (r === repo || r === name); })) return k;
    }
    return catchAllRoom();
  }

  // everything = also the archived and long-asleep sessions, which nap upstairs instead of in the rooms
  function allCats(everything) {
    const cats = [];
    let upstairs = 0;
    const cutoff = Date.now() - STALE_DAYS * 864e5;
    for (const s of S.sessions || []) {
      const c = catFromSession(s);
      c.away = c.archived || (c.mood === "sleep" && c.updated < cutoff && !S.showOld);
      if (c.away && !everything) { upstairs++; continue; }
      cats.push(c);
    }
    for (const d of S.adopted) cats.push(catFromAdopted(d));
    for (const c of cats) {
      const t = S.tweaks[c.id];
      c.name = (t && t.name) || c.nameOverride || NAMES[hash(c.id) % NAMES.length];
      c.project = projectOf(c);
      const look = lookOf(c.project);
      c.coat = COATS[look.coat].f;
      c.emblem = look.emblem;
      c.roomKey = roomFor(c);
    }
    cats.sort((a, b) => MOODS[a.mood].rank - MOODS[b.mood].rank || b.updated - a.updated);
    return { cats, upstairs };
  }

  /* ---------- drawing ---------- */
  function sprite(mood, coat) {
    const s = el("span", "spr px " + SPR[mood].cls);
    if (coat && coat !== "none") s.style.setProperty("--tint", coat);
    return s;
  }
  function emblem(i, cls) {
    const e = el("span", "emb " + (cls || ""));
    e.style.setProperty("--e", i);
    e.title = EMBLEMS[i].name;
    return e;
  }
  function ago(t) {
    if (!t) return "";
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    const h = Math.round(m / 60);
    if (h < 24) return h + " h ago";
    const d = Math.round(h / 24);
    return d === 1 ? "yesterday" : d + " days ago";
  }
  const clock = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  // a room's cats by mood, most urgent first, in words; and the rooms where cats need you
  const summary = (cats) => [["cry", "upset"], ["meow", "meowing"], ["box", "to review"], ["idle", "at work"], ["sleep", "asleep"]]
    .map(([m, w]) => [cats.filter((c) => c.mood === m).length, w]).filter(([n]) => n).map(([n, w]) => n + " " + w).join(", ") || "no cats";
  const needIn = (cats, k) => cats.filter((c) => c.roomKey === k && MOODS[c.mood].needs);
  function badge(need) {
    const b = el("span", "badge " + MOODS[need[0].mood].kind);
    b.append(el("span", "face-ico"), el("span", "n", String(need.length)));
    return b;
  }

  let VIEW = { cats: [], placed: [], piles: {}, queens: {}, upstairs: 0 };

  function drawProps() {
    const box = $("props");
    for (const p of PROPS) {
      const d = el("div", "prop px");
      const [sx, sy, w, h] = p.s;
      Object.assign(d.style, { width: w + "px", height: h + "px", left: (p.at[0] * 2 - w / 2) + "px", top: (p.at[1] * 2 - h) + "px",
        backgroundImage: "url(art/licensed/pochi.png)", backgroundPosition: `-${sx}px -${sy}px`, zIndex: p.at[1] * 2 });
      box.appendChild(d);
    }
    const hits = $("hits");
    for (const k of ORDER) {
      const [x, y, w, h] = GEOM[k].r;
      const b = el("button", "roomhit");
      b.type = "button";
      b.id = "room-" + k;
      b.dataset.room = k;
      b.setAttribute("aria-describedby", "keyhelp");
      Object.assign(b.style, { left: x * 2 + "px", top: y * 2 + "px", width: w * 2 + "px", height: h * 2 + "px" });
      b.addEventListener("click", (e) => { e.stopPropagation(); if (armed("room", k)) return; focusRoom(k); });
      b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enterMenu(k, b); } });
      hoverable(b, "room", k);
      hits.appendChild(b);
    }
    for (const k of ORDER) {
      const box = GEOM[k].cabinet;

  }

      for (const k of ORDER) {
        const [x, y, w] = GEOM[k].r;
        const need = needIn(VIEW.cats, k), room = (w - 5) * 2 * cam.s - 5;   // inside the left wall to the right one
        const named = cam.s >= 0.5 && room >= 56;
        if (!named && !need.length) continue;
        const tag = el("div", "tag sign");
        tag.dataset.room = k;
        tag.setAttribute("aria-hidden", "true");
        if (named) tag.appendChild(el("span", "nm", roomInfo(k).name));
        if (need.length) tag.appendChild(badge(need));
        const [sx, sy] = toScreen((x + 5) * 2, (y + 5) * 2);
        Object.assign(tag.style, { left: sx + 3 + "px", top: sy + 3 + "px", maxWidth: Math.max(room, 40) + "px" });
        ov.appendChild(tag); signs.push(tag);
      }
    }
    const text = !!S.focus;
    const taken = signs.map((t) => [t.offsetLeft, t.offsetTop, t.offsetLeft + t.offsetWidth, t.offsetTop + t.offsetHeight]);   // faces keep off the signs
    // the room's filing cabinet gets a sign when you're in the room; bubbles keep clear of it
    const cab = S.focus && GEOM[S.focus].cabinet;
    if (cab) {
      const [sx, sy] = toScreen(cab[0] * 2 + cab[2], cab[1] * 2);
      const t = el("button", "tag files", "Files");
      t.type = "button";
      Object.assign(t.style, { left: sx + "px", top: sy - 4 + "px" });
      t.addEventListener("click", () => openCabinet(S.focus));
      ov.appendChild(t);
      taken.push([sx - 26, sy - 30, sx + 26, sy]);
    }
    // A text bubble goes above the cat; if that is off the top or on another bubble, below it;
    // failing both, the cat just shows the little face icon.
    function bubble(p, kind, title, body, act, hoverKind, hoverKey, aria, sidestep) {
      const [sx, sy] = toScreen(p.x, p.y);
      if (sx < 0 || sx > cam.W || sy < 0 || sy > cam.H + 20) return;
      const clampX = Math.min(Math.max(sx, 104), cam.W - 104);
      const feetY = toScreen(p.x, p.feet)[1] + 14;
      const up = [clampX - 101, sy - 96, clampX + 101, sy], down = [clampX - 101, feetY - 6, clampX + 101, feetY + 90];
      const free = (r) => !taken.some((t) => r[0] < t[2] && t[0] < r[2] && r[1] < t[3] && t[1] < r[3]);
      let mode = "icon";
      if (text && up[1] >= 0 && free(up)) mode = "up";
      else if (text && down[3] <= cam.H + 10 && free(down)) mode = "down";
      // a face goes over the cat's head. If a sign is there, a cat's face gives way: its room's badge
      // already shows it. A queen is in no badge, so hers steps beside her head instead.
      let [ix, iy] = [sx, sy];
      if (mode !== "icon") taken.push(mode === "up" ? up : down);
      else {
        const at = [[sx, sy], ...(sidestep ? [[sx + 30, sy + 24], [sx - 30, sy + 24]] : [])].find(([x, y]) => free([x - 16, y - 36, x + 16, y]));
        if (!at) return;
        [ix, iy] = at;
        taken.push([ix - 16, iy - 36, ix + 16, iy]);
      }
      const below = mode === "down", asText = mode !== "icon";
      const b = el("button", "bub " + kind + (asText ? "" : " icon") + (below ? " below" : ""));
      b.type = "button";
      b.setAttribute("aria-label", aria);
      if (asText) { const hd = el("b"); hd.append(el("span", "face face-ico"), document.createTextNode(title)); b.append(hd, el("span", "t", body)); }
      else b.appendChild(el("span", "face face-ico"));
      Object.assign(b.style, { left: (asText ? clampX : ix) + "px", top: (below ? feetY : asText ? sy - 10 : iy - 4) + "px" });
      b.addEventListener("click", act);
      hoverable(b, hoverKind, hoverKey);
      ov.appendChild(b);
    }
    for (const p of VIEW.placed) {
      const m = MOODS[p.cat.mood];
      if (!m.needs) continue;
      if (S.focus && p.room !== S.focus) continue;
      bubble(p, m.kind, p.cat.name, p.cat.ask,
        () => { if (!armed("cat", p.cat.id)) catClicked(p.cat, p.room); }, "cat", p.cat.id,
        p.cat.name + ": " + m.short + ". " + p.cat.ask);
    }
    // the queens hand you what they are keeping, without your having to ask
    for (const k of ORDER) {
      const p = VIEW.queens[k];
      if (!p || !p.queen.pinned.length) continue;
      if (S.focus && p.room !== S.focus) continue;
      const q = p.queen;
      bubble(p, "queenb", q.name, q.pinned[0].text,
        () => { if (!armed("queen", k)) { hideMenu(); openQueen(k); } }, "queen", k,
        q.name + ", queen of the " + roomInfo(k).name + ", is keeping: " + q.pinned[0].text, true);
    }
  }

  /* ---------- status line ---------- */
  // The cat sheets are licensed, so they are never committed and never shared: a checkout, or
  // anyone else's copy, draws the cabin and no cats at all, and used to say nothing about it.
  // Ask the browser for one of them and, if it isn't there, tell the viewer how to put it right.
  function checkArt() {
    const img = new Image();
    img.addEventListener("load", () => { S.art = "ok"; renderStatus(); });
    img.addEventListener("error", () => { S.art = "missing"; renderStatus(); });

  function renderStatus() {
    const st = $("status"); st.replaceChildren();
    const L = S.live;
    st.classList.toggle("warn", L.state !== "ok" && L.state !== "loading" && L.state !== "local");
    st.appendChild(el("span", "dot" + (L.state === "loading" ? " wait" : "")));
    const msg = $("stageMsg");
    msg.hidden = true;
    if (L.state === "loading") st.appendChild(el("span", "words", "Waking the cats… (the first visit asks to read your Claude Code sessions)"));
    else if (L.state === "ok") {
      const n = (S.sessions || []).length;
      st.appendChild(el("span", "words", "Live · updated " + clock(S.sessionsAt) + " · your " + n + " most recent Claude Code sessions, checked every minute"));
    } else if (L.state === "local") {
      st.appendChild(el("span", "words", S.from === "copy"
        ? "On this computer: your " + S.sessions.length + " sessions as Claude saved them " + new Date(S.sessionsAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) + ". Ask Claude to refresh data/sessions.json for newer cats."
        : "On this computer, with no saved sessions yet. Put Claude's data/sessions.json next to the page."));
    } else {
      st.appendChild(el("span", "words", L.message));
      if (L.action) { const b = el("button", "btn", L.action.label); b.type = "button"; b.addEventListener("click", L.action.run); st.appendChild(b); }
      if (S.from === "copy") st.appendChild(el("span", "copy words", "Meanwhile these are Claude's copy of your " + S.sessions.length + " sessions, saved " + new Date(S.sessionsAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) + "."));
      if (!S.sessions || !S.sessions.length) { msg.hidden = false; msg.textContent = L.state === "stale" ? "Couldn't reach your sessions just now." : "Only adopted chats are showing."; }
    }
    if (L.state === "local" && (!S.sessions || !S.sessions.length)) { msg.hidden = false; msg.textContent = "Only adopted chats are showing."; }
    if (L.state === "loading") { msg.hidden = false; msg.textContent = "Waking the cats…"; }
    // Nothing to do with the sessions: the cats can be there and still have nothing to draw with.
    if (S.art === "missing") {
      st.classList.add("warn");
      st.appendChild(el("span", "copy words", "The cat art isn't here: art/licensed/ is licensed and never shipped, so the cabin draws but the cats can't. Buy the packs in catio/art/CREDITS.md, drop the zips in, and run catio/tools/build-art.py."));
    }
  }

  /* ---------- live data: Claude Code sessions ---------- */
  // The live feed wins; when it's blocked or unavailable, show the copy Claude last saved to snapshot/sessions.
  function pick() {
    if (S.liveSessions) { S.sessions = S.liveSessions; S.sessionsAt = S.liveAt; S.from = "live"; }
    else if (S.copy && Array.isArray(S.copy.sessions)) { S.sessions = S.copy.sessions; S.sessionsAt = S.copy.at; S.from = "copy"; }
    else { S.sessions = null; S.from = null; S.prevNeeding = null; }
  }

  function sessionsFrom(result) {
    let p = result && result.payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { p = null; } }
    if (!p) return null;
    const d = p.data || (p.ccr && p.ccr.data) || (Array.isArray(p) ? p : null);
    return Array.isArray(d) ? d : null;
  }
  const RETRACT = new Set(["needs_reauth", "server_not_connected", "selection_required", "server_not_found", "blocked_by_policy", "approval_required", "not_in_manifest", "consent_required", "not_granted", "capability_disabled", "capability_removed"]);
  function problem(err) {
    const code = err && err.code;
    const reload = { label: "Try again", run: () => watch(true) };
    switch (code) {
      case "server_not_connected": case "server_not_found":
        return { message: "Claude Code Remote isn't connected for you right now. It's built into claude.ai, so it isn't in your Connectors list to add; try again later.", action: reload };
      case "selection_required":
        return { message: "You have more than one Claude Code Remote connector. Pick one when claude.ai asks, then try again.", action: reload };
      case "needs_reauth":
        return { message: "Claude Code Remote needs reconnecting in claude.ai Settings → Connectors.", action: reload };
      case "not_in_manifest": case "consent_required":
        return { message: "This page isn't allowed to read your Claude Code sessions yet.", action: { label: "Allow", run: allow } };
      case "approval_required": case "blocked_by_policy":
        return { message: "claude.ai doesn't let pages read your Claude Code sessions live yet. Claude Code Remote is built in, so it has no switch in your Connectors list: there's nothing for you to change.", action: reload };
      case "not_granted": case "capability_disabled": case "capability_removed":
        return { message: "Live sessions can't load in this view. Open the page in claude.ai to see them." };
      case "tool_error":
        return { message: "Claude Code Remote answered with an error: " + (err.message || "no detail") + ".", action: reload };
      default:
        return { message: S.sessions ? "Couldn't refresh. These are the cats from " + clock(S.sessionsAt) + "." : "Couldn't reach your sessions just now.", action: reload, stale: true };
    }
  }
  async function allow() {
    if (S.perms) { try { await S.perms.request(["mcp:" + SERVER]); } catch (e) {} }
    watch(true);
  }
  function watch(fresh) {
    if (!S.mcp) return;
    if (S.unwatch) { S.unwatch(); S.unwatch = null; }
    if (fresh && S.mcp.invalidate) S.mcp.invalidate(SERVER, "list_sessions").catch(() => {});
    S.live = { state: "loading" }; renderStatus();
    S.unwatch = S.mcp.watchTool(SERVER, "list_sessions", { limit: PAGE }, (ev) => {
      if (ev.type === "data") {
        const list = sessionsFrom(ev.result);
        if (!list) { S.live = { state: "error", message: "Claude Code Remote answered in a shape this page doesn't recognise." }; renderStatus(); return; }
        S.liveSessions = list;
        S.liveAt = (ev.result.cache && ev.result.cache.storedAt) || Date.now();
        S.live = { state: "ok" };
        pick();
        render();
      } else {
        const err = ev.error || {};
        if (RETRACT.has(err.code)) S.liveSessions = null;
        pick();
        const p = problem(err);
        S.live = { state: p.stale ? "stale" : "error", message: p.message, action: p.action };
        render();
      }
    }, { refetchInterval: 60000 });
  }

  /* ---------- shared data: rooms, renames and moves, adopted chats ---------- */
  function subscribe() {
    const db = S.db;
    const fail = (e) => toast("Couldn't load saved rooms and chats (" + (e && e.code || "error") + ").");
    db.collection("rooms").onSnapshot((snap) => { const r = {}; for (const d of snap.docs) r[d.id] = d.data(); S.rooms = r; render(); }, fail);
    db.collection("sessions").onSnapshot((snap) => { const t = {}; for (const d of snap.docs) t[d.id] = d.data(); S.tweaks = t; render(); }, fail);
    db.collection("cats").onSnapshot((snap) => { S.adopted = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); render(); }, fail);
    db.doc("snapshot/sessions").onSnapshot((d) => { S.copy = d.exists ? d.data() : null; pick(); render(); }, fail);
    db.collection("projects").onSnapshot((snap) => { const p = {}; for (const d of snap.docs) p[d.id] = d.data(); S.projects = p; render(); }, fail);
    db.collection("queens").onSnapshot((snap) => { const q = {}; for (const d of snap.docs) q[d.id] = d.data(); S.queens = q; render(); }, fail);
  }
  async function save(fn, ok) {
    if (!S.db) { toast("Saving isn't available in this view."); return false; }
    try { await fn(S.db); if (ok) toast(ok); return true; }
    catch (e) { toast(e && e.code === "invalid_argument" ? "You can look but not change things on this page." : "Couldn't save (" + (e && e.code || "error") + "). Try again."); return false; }
  }

  // Her card: what she is keeping, what to give her, and what she should say out loud.

    const dlg = $("queenDlg"); dlg.replaceChildren();

    const q = queenOf(k);
    const notes = q.notes.map((n) => ({ text: n.text, pinned: !!n.pinned, at: n.at || Date.now() }));
    const box = el("div", "dlg");

    const head = el("div", "head");
    const por = el("div", "portrait");
    por.append(sprite(queenMood(q, here), q.coat), el("span", "crown corner"));
    const hd = el("div");
    const h = el("h2", null, q.name); h.id = "queenName";
    hd.append(h, el("span", "mood work", "Queen of the " + roomInfo(k).name));
    head.append(por, hd);
    box.append(head, el("div", null, queenLine(q, here)));

    box.appendChild(el("p", "sub", "What she keeps"));
    const list = el("ul", "keeps");
    function draw() {
      list.replaceChildren();
      if (!notes.length) list.appendChild(el("li", "sub", "She is keeping nothing for this room yet."));

        const li = el("li", n.pinned ? "kept pin" : "kept");

        pin.title = n.pinned ? "She says this in the room until you take it back" : "Have her say this out loud in the room";

  function openCabinet(room) {
    const groups = new Map();
    for (const c of allCats(true).cats.filter((x) => x.roomKey === room)) {
      const g = groups.get(c.project.key) || { p: c.project, cats: [] };
      g.cats.push(c);
      groups.set(c.project.key, g);
    }
    for (const r of roomInfo(room).repos) {
      const name = r.split("/").pop(), key = slug(name);
      if (!groups.has(key)) groups.set(key, { p: { key, name, repo: r.includes("/") ? r : "" }, cats: [] });
    }
    const dlg = $("roomsDlg"); dlg.replaceChildren(); dlg.classList.remove("wide");
    dlg.setAttribute("aria-labelledby", "cabKick roomsTitle");
    const box = el("div", "dlg"), r = roomInfo(room);
    const kick = el("p", "kicker", "Filing cabinet"); kick.id = "cabKick";
    const h = el("h2", r.name.length > 16 ? "long" : null, r.name); h.id = "roomsTitle";   // 36px while it fits, 18px when long
    const hd = el("div"); hd.append(kick, h);
    if (r.blurb) hd.appendChild(el("p", "blurb", r.blurb));
    box.append(hd, el("p", "note", "Every project filed in this room, with all its cats, including the ones napping upstairs or archived."));
    if (!groups.size) box.appendChild(el("p", "empty", "Nothing is filed here yet. A project lands in this room when its repository is listed under Edit rooms, or when you move one of its cats here."));
    // the projects with cats that need you come first
    const urgent = (g) => Math.min(9, ...g.cats.filter((c) => !c.away && MOODS[c.mood].needs).map((c) => MOODS[c.mood].rank));
    for (const { p, cats } of [...groups.values()].sort((a, b) => urgent(a) - urgent(b))) {
      const look = lookOf(p);
      const card = el("section", "proj");
      const head = el("div", "proj-head");
      const pic = el("span", "proj-pic"); pic.append(sprite("idle", COATS[look.coat].f), emblem(look.emblem, "corner"));
      const t = el("div");
      t.appendChild(el("h3", null, p.name));
      const n = (m) => cats.filter((c) => !c.away && c.mood === m).length;
      const bits = [[n("meow") + n("cry") + n("box"), "need you"], [n("idle"), "at work"], [n("sleep"), "asleep"], [cats.filter((c) => c.away).length, "upstairs or archived"]]
        .filter(([k]) => k).map(([k, w]) => k + " " + w);
      t.appendChild(el("p", "note", bits.join(" · ") || "No cats right now"));
      if (p.repo && p.repo.includes("/")) { const a = el("a", null, "On GitHub"); a.href = "https://github.com/" + p.repo; a.target = "_blank"; a.rel = "noopener"; t.appendChild(a); }
      head.append(pic, t);
      card.appendChild(head);
      if (cats.length) {
        const ul = el("ul", "pilelist");
        for (const c of cats) {
          const li = el("li");
          const b = c.away ? el("a", "item file") : el("button", "item file " + MOODS[c.mood].kind);
          if (c.away) { b.href = c.link; b.target = "_blank"; b.rel = "noopener"; } else { b.type = "button"; b.addEventListener("click", () => openCat(c.id)); }
          const th = el("span", "thumb"); th.appendChild(sprite(c.away ? "sleep" : c.mood, c.coat));
          const txt = el("span");
          txt.append(el("span", "who", c.name), el("div", "what", (c.archived ? "Archived" : c.away ? "Napping upstairs" : MOODS[c.mood].short) + " · " + c.title + " · " + ago(c.updated)));
          if (c.branch) txt.appendChild(el("div", "what branch", c.branch));
          b.append(th, txt);
          li.appendChild(b); ul.appendChild(li);
        }
        card.appendChild(ul);
      }
      const r = el("div", "row");
      const em = el("select"); em.id = "em-" + p.key;
      EMBLEMS.forEach((e, i) => { const o = el("option", null, e.name); o.value = i; if (i === look.emblem) o.selected = true; em.appendChild(o); });
      const coat = el("select"); coat.id = "coat-" + p.key;
      COATS.forEach((e, i) => { const o = el("option", null, e.name); o.value = i; if (i === look.coat) o.selected = true; coat.appendChild(o); });
      const sv = el("button", "btn green", "Save look"); sv.type = "button";
      sv.addEventListener("click", () => save((db) => db.doc("projects/" + p.key).set({ name: p.name, emblem: Number(em.value), coat: Number(coat.value) }), "Saved. Every " + p.name + " cat now looks like this."));
      r.append(field("Emblem", em), field("Coat", coat), sv);
      card.appendChild(r);
      box.appendChild(card);
    }
    const acts = el("div", "actions"); acts.append(el("span", "spacer"), closeBtn(dlg));
    box.appendChild(acts);
    dlg.appendChild(box);
    show(dlg);
  }

  function openAdopt(room) {
    const dlg = $("adoptDlg"); dlg.replaceChildren();
    const box = el("div", "dlg");
    const h = el("h2", null, "Adopt a cat"); h.id = "adoptTitle";
    box.append(h, el("p", "note", "Your Claude Code sessions move in by themselves. Chats on claude.ai can't be read by this page, so each one you adopt becomes a cat you look after by hand: a business plan, a legal question, anything else."));
    box.appendChild(adoptForm(null, room));
    dlg.appendChild(box);
    show(dlg);
    $("adTitle").focus();
  }

  function openPile(pile, room) {
    const dlg = $("catDlg"); dlg.replaceChildren();
    const box = el("div", "dlg");
    const h = el("h2", "long", pile.length + " cats curled up in the " + roomInfo(room).name); h.id = "catName";
    const ul = el("ul", "pilelist");
    for (const c of pile) {
      const li = el("li");
      const b = el("button", "item " + MOODS[c.mood].kind); b.type = "button";
      const th = el("span", "thumb"); th.appendChild(sprite(c.mood, c.coat));
      const txt = el("span"); txt.append(el("span", "who", c.name), el("div", "what", MOODS[c.mood].short + " · " + c.title));
      b.append(th, txt);
      b.addEventListener("click", () => openCat(c.id));
      li.appendChild(b); ul.appendChild(li);
    }
    const acts = el("div", "actions"); acts.appendChild(closeBtn(dlg));
    box.append(h, ul, acts);
    dlg.appendChild(box);
    show(dlg);
  }

  // The Rooms editor: the cabin as a plan, each room a tab; the chosen room's card below it; then the
  // one room new cats come in to. Saving writes every room, as before.
  const PLAN = [56, 88, 1168, 672];   // the part of the meadow the house stands on, in scene pixels
  function openRooms(start) {
    const dlg = $("roomsDlg"); dlg.replaceChildren(); dlg.classList.add("wide");
    dlg.setAttribute("aria-labelledby", "roomsTitle");
    const f = el("form", "dlg");
    const h = el("h2", null, "Rooms"); h.id = "roomsTitle";
    f.append(h, el("p", "note", "Pick a room on the plan to name it and list the GitHub repositories whose cats move in."));
    const plan = el("div", "plan"), art = el("div", "plan-art"), tabs = el("div");
    for (const src of ["art/house.png", "art/licensed/decor.png"]) { const i = el("img"); i.src = src; i.alt = ""; art.appendChild(i); }
    tabs.setAttribute("role", "tablist"); tabs.setAttribute("aria-label", "Rooms on the plan");
    plan.append(art, tabs);
    f.appendChild(plan);
    const catchKey = catchAllRoom();
    const door = el("span", "door"); door.setAttribute("aria-hidden", "true");
    const ca = el("select"); ca.id = "catchAll";
    const pct = (v, i) => ((v - (i < 2 ? PLAN[i] : 0)) / PLAN[i % 2 + 2] * 100) + "%";
    const named = {};   // room -> its Name field
    const tabName = (k) => $("rt-" + k).setAttribute("aria-label", (named[k].value.trim() || GEOM[k].name) + (ca.value === k ? ", where new cats come in" : ""));
    let sel = GEOM[start] ? start : S.cursor || catchKey;
    const pick = (k, focus) => {
      sel = k;
      for (const t of tabs.children) { const on = t.dataset.room === k; t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1; }
      for (const k2 of ORDER) $("rp-" + k2).hidden = k2 !== k;
      if (focus) $("rt-" + k).focus();
    };
    for (const k of ORDER) {
      const r = roomInfo(k), [x, y, w, hh] = GEOM[k].r;
      const t = el("button", "rt"); t.type = "button"; t.id = "rt-" + k; t.dataset.room = k;
      t.setAttribute("role", "tab"); t.setAttribute("aria-controls", "rp-" + k);
      Object.assign(t.style, { left: pct(x * 2, 0), top: pct(y * 2, 1), width: pct(w * 2, 2), height: pct(hh * 2, 3) });
      const sign = el("span", "tag", r.name);
      t.appendChild(sign);
      if (k === catchKey) t.appendChild(door);
      t.addEventListener("click", () => pick(k));
      tabs.appendChild(t);

      const p = el("section", "rcard"); p.id = "rp-" + k;
      p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", "rt-" + k);
      const title = el("h3", null, r.name);
      if (r.name !== GEOM[k].name) title.append(" ", el("span", null, "· the " + GEOM[k].name.toLowerCase() + " on the plan"));
      const here = VIEW.cats.filter((c) => c.roomKey === k);
      p.append(title, el("p", "note", here.length ? "Here now: " + summary(here) + "." : "No cats in here right now."));
      const nm = el("input"); nm.id = "rn-" + k; nm.value = r.name; nm.maxLength = 30; nm.placeholder = GEOM[k].name; named[k] = nm;
      const bl = el("input"); bl.id = "rb-" + k; bl.value = r.blurb; bl.maxLength = 80; bl.placeholder = "Weekly meals, the shop, legal questions…";
      const rp = el("input"); rp.id = "rr-" + k; rp.value = r.repos.join(", "); rp.placeholder = "owner/repo, another-repo";
      const row = el("div", "row"); row.append(field("Name", nm), field("What lives here", bl));
      p.append(row, field("Repositories, separated by commas", rp));
      f.appendChild(p);
      const o = el("option", null, r.name); o.value = k; ca.appendChild(o);
      // the plan, the card and the front-door choice follow the name as she types it
      nm.addEventListener("input", () => { const v = nm.value.trim() || GEOM[k].name; sign.textContent = v; o.textContent = v; title.firstChild.textContent = v; tabName(k); });
    }
    ca.value = catchKey;
    ca.addEventListener("change", () => { $("rt-" + ca.value).appendChild(door); ORDER.forEach(tabName); });
    tabs.addEventListener("keydown", (e) => {
      const to = e.key === "Home" ? ORDER[0] : e.key === "End" ? ORDER[ORDER.length - 1] : NEXT[sel][e.key];
      if (/^Arrow|^Home$|^End$/.test(e.key)) e.preventDefault();
      if (to) pick(to, true);
    });
    f.append(el("div", "rule"), field("New cats come in to", ca),
      el("p", "note", "Cats from a repository no room lists come in here, through the front door."));
    const acts = el("div", "actions"); acts.append(el("span", "spacer"), closeBtn(dlg, "Cancel"));
    const sv = el("button", "btn green", "Save rooms"); sv.type = "submit"; acts.appendChild(sv);
    f.appendChild(acts);
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const chosen = GEOM[ca.value] ? ca.value : "living";
      const ok = await save(async (db) => {
        for (const k of ORDER) {
          const repos = $("rr-" + k).value.split(",").map((x) => x.trim()).filter(Boolean);
          await db.doc("rooms/" + k).set({ name: $("rn-" + k).value.trim() || GEOM[k].name, blurb: $("rb-" + k).value.trim(), repos, catchAll: k === chosen });
        }
      }, "Rooms saved.");
      if (ok) dlg.close();
    });
    dlg.appendChild(f);
    ORDER.forEach(tabName);
    pick(sel);
    show(dlg);
    if (GEOM[start]) $("rn-" + start).focus();
  }

  /* ---------- sound ---------- */
  let audio = null;
  function meow() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      const o = audio.createOscillator(), f = audio.createBiquadFilter(), g = audio.createGain();
      o.type = "sawtooth"; f.type = "bandpass"; f.Q.value = 4;
      o.frequency.setValueAtTime(480, t); o.frequency.linearRampToValueAtTime(760, t + 0.14); o.frequency.linearRampToValueAtTime(520, t + 0.5);
      f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(1900, t + 0.16); f.frequency.linearRampToValueAtTime(1000, t + 0.5);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(f).connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.6);
    } catch (e) {}
  }

  let toastT;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }

  /* ---------- start ---------- */
  drawProps();
  layout(true);
  render();
  checkArt();
  new ResizeObserver(() => { hideMenu(); layout(true); }).observe($("stage"));
  $("menu").addEventListener("pointerenter", () => clearTimeout(MENU.hideT));
  $("menu").addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") hideSoon(); });
  // tapping or clicking the open meadow closes the menu, then zooms back out.
  // The path is taken when the event is dispatched, so a button the menu replaced while handling
  // the click — Sound, Bring them down, anything that redraws the menu under your pointer — is
  // still known to have come from the menu. Reading e.target alone sees a node with no parent by
  // then, calls it a click on the meadow, and shuts the menu you are using.
  $("stage").addEventListener("click", (e) => {
    const path = (e.composedPath && e.composedPath()) || [e.target];
    const chrome = path.some((n) => n && n.nodeType === 1 &&
      (n === $("menu") || (n.matches && n.matches(".cat, .roomhit, .cabinet, .bub, .tag"))));
    if (chrome) return;
    if (MENU.kind) hideMenu(); else zoomOut();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || document.querySelector("dialog[open]")) return;
    if (MENU.kind) hideMenu(); else zoomOut();
  });
  setInterval(render, 60000); // keep "3 min ago" honest
  $("stage").addEventListener("keydown", arrows);
  $("menu").addEventListener("keydown", (e) => {   // Escape in a room's menu goes back to the room, menu still open
    if (e.key !== "Escape" || MENU.kind !== "room") return;
    e.stopPropagation();
    $("room-" + MENU.key).focus({ preventScroll: true });
  });
  // a dialog opened from a menu can't hand focus back to it once the menu has shut: give it to the room
  for (const d of document.querySelectorAll("dialog")) d.addEventListener("close", () => {
    const a = document.activeElement;
    if (!a || a === document.body || d.contains(a)) $("room-" + (S.focus || S.cursor || "living")).focus({ preventScroll: true });
  });

  // In claude.ai the artifact runtime serves db and mcp. Opened from a folder on localhost there is
  // no runtime: keep rooms, looks and adopted cats in this browser, and read the cats from
  // data/sessions.json, the copy of your sessions Claude saves.
  const local = !(window.claude && window.claude.use);
  const use = local ? localRuntime() : (n) => window.claude.use(n).catch(() => null);
  use("permissions").then((p) => { S.perms = p; });
  use("db").then((db) => { S.db = db; if (db) subscribe(); });
  use("mcp").then((mcp) => {
    S.mcp = mcp;
    if (mcp) watch(false);
    else if (local) { S.live = { state: "local", message: "Running on this computer." }; pick(); render(); }
    else { S.live = { state: "error", message: "Live sessions can't load in this view. Open the page in claude.ai to see them." }; pick(); render(); }
  });

  function localRuntime() {
    const KEY = "catio.local.db";
    let store = {};
    try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
    const listeners = new Set();
    const segs = (p) => p.split("/");
    const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
    const docSnap = (p) => ({ id: segs(p).pop(), exists: p in store, data: () => store[p] && JSON.parse(JSON.stringify(store[p])) });
    const collSnap = (c) => {
      const docs = Object.keys(store).filter((p) => p.startsWith(c + "/") && segs(p).length === segs(c).length + 1).sort().map(docSnap);
      return { docs, size: docs.length, empty: !docs.length };
    };
    const tell = () => { for (const l of listeners) setTimeout(l, 0); };
    const doc = (p) => ({
      path: p, id: segs(p).pop(),
      get: async () => docSnap(p),
      set: async (d) => { store[p] = JSON.parse(JSON.stringify(d)); persist(); tell(); },
      update: async (d) => { if (!(p in store)) throw { code: "invalid_argument", message: "no such document" }; Object.assign(store[p], JSON.parse(JSON.stringify(d))); persist(); tell(); },
      delete: async () => { delete store[p]; persist(); tell(); },
      onSnapshot: (cb) => { const l = () => cb(docSnap(p)); listeners.add(l); setTimeout(l, 0); return () => listeners.delete(l); },
    });
    const collection = (c) => ({
      path: c,
      doc: (id) => doc(c + "/" + (id || Date.now().toString(36) + Math.random().toString(36).slice(2, 8))),
      onSnapshot: (cb) => { const l = () => cb(collSnap(c)); listeners.add(l); setTimeout(l, 0); return () => listeners.delete(l); },
    });
    // another tab saved something: pick it up
    addEventListener("storage", (e) => { if (e.key === KEY) { try { store = JSON.parse(e.newValue || "{}"); } catch (err) {} tell(); } });
    const db = { doc, collection };
    // first run: the rooms, then Claude's copy of the sessions, from the data folder
    const ready = (async () => {
      const get = async (f) => { try { const r = await fetch(f, { cache: "no-store" }); return r.ok ? r.json() : null; } catch (e) { return null; } };
      if (!Object.keys(store).some((p) => p.startsWith("rooms/"))) {
        const rooms = await get("data/rooms.json");
        if (rooms) for (const [k, v] of Object.entries(rooms)) store["rooms/" + k] = v;
      }
      const copy = await get("data/sessions.json");
      if (copy) store["snapshot/sessions"] = copy;
      persist(); tell();
    })();
    return async (n) => { await ready; return n === "db" ? db : null; };
  }
})();
</script>
