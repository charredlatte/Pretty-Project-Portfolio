#  Deletes the branches already merged into the default branch, the ones the house rules let go of.
#
#  A branch goes only when every commit on it is already in the default branch and no pull request
#  is open from it. The default branch itself is never touched, and nor is anything unmerged.
#  "Automatically delete head branches" handles each merge from now on; this clears what piled up
#  before it, and anything merged some other way.
#
#  Run it by hand (Actions > Prune merged branches > Run workflow). It lists what it would delete
#  unless "dry run" is unticked. A deleted branch can be restored from the repo's branches page.

name: Prune merged branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, and delete nothing
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Delete the branches fully merged into the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          open=$(gh pr list --state open --limit 1000 --json headRefName --jq '.[].headRefName')
          gone=0 kept=0
          for b in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin); do
            if [ "$b" = HEAD ] || [ "$b" = "$DEFAULT" ]; then continue; fi
            if printf '%s\n' "$open" | grep -qxF -- "$b"; then
              echo "keep    $b (a pull request is open from it)"; kept=$((kept + 1))
            elif git merge-base --is-ancestor "origin/$b" "origin/$DEFAULT"; then
              if [ "$DRY_RUN" = true ]; then
                echo "would delete    $b"
              else
                git push --quiet origin --delete "$b"
                echo "deleted    $b"
              fi
              gone=$((gone + 1))
            else
              echo "keep    $b (not merged)"; kept=$((kept + 1))
            fi
          done
          echo "$gone merged into $DEFAULT, $kept kept$([ "$DRY_RUN" = true ] && echo ' (dry run: nothing deleted)')"
