#  Deletes the branches already merged into the default branch, the ones the house rules let go of.
#
#  A branch goes only when every commit on it is already in the default branch, and no open pull
#  request comes from it or goes into it. The default branch itself is never touched, nor anything
#  unmerged, nor a branch whose last commit is under a day old (a session may still be on it). Each
#  deletion is pinned to the commit this run checked, so a branch someone pushes to meanwhile is kept.
#  "Automatically delete head branches" handles each merge from now on; this clears what piled up
#  before it. A squash or rebase merge leaves a branch's commits out of the default branch's history,
#  so those branches are kept: delete them from their pull request's page.
#
#  Run it by hand (Actions > Prune merged branches > Run workflow). It lists what it would delete
#  unless "dry run" is unticked. Nothing is lost from git: every commit on a deleted branch is in the
#  default branch. A branch that had a pull request can be restored from that pull request's page.

name: Prune merged branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted, and delete nothing
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Delete the branches fully merged into the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          open=$(gh pr list --state open --limit 1000 --json headRefName,baseRefName \
            --jq '.[] | .headRefName, .baseRefName') || { echo "couldn't list the open pull requests"; exit 1; }
          gone=0 kept=0 failed=0 recent=$(( $(date +%s) - 86400 ))
          for b in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin); do
            if [ "$b" = HEAD ] || [ "$b" = "$DEFAULT" ]; then continue; fi
            sha=$(git rev-parse "refs/remotes/origin/$b")
            if grep -qxF -- "$b" <<<"$open"; then  # not a pipe: grep -q stops early, and pipefail reads that as no
              echo "keep    $b (an open pull request comes from it or goes into it)"; kept=$((kept + 1))
            elif [ "$(git log -1 --format=%ct "$sha")" -gt "$recent" ]; then
              echo "keep    $b (its last commit is under a day old)"; kept=$((kept + 1))
            elif git merge-base --is-ancestor "$sha" "refs/remotes/origin/$DEFAULT"; then
              if [ "$DRY_RUN" = true ]; then
                echo "would delete    $b"; gone=$((gone + 1))
              elif git push --quiet --force-with-lease="refs/heads/$b:$sha" origin ":refs/heads/$b"; then
                echo "deleted    $b"; gone=$((gone + 1))
              else
                echo "FAILED    $b (it may have moved since this run checked it)"; failed=$((failed + 1))
              fi
            else
              echo "keep    $b (not merged)"; kept=$((kept + 1))
            fi
          done
          if [ "$DRY_RUN" = true ]; then echo "$gone would be deleted (dry run: nothing deleted), $kept kept"
          else echo "$gone deleted, $failed failed, $kept kept"; fi
          [ "$failed" -eq 0 ]
