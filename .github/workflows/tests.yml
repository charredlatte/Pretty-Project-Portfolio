#  The harness suite, on both platforms.
#
#  Windows is not decoration here: every bug this workflow was added alongside was invisible on
#  Linux and fatal on Windows, because the default text encoding there is cp1252 rather than UTF-8
#  and shutil.which only matches names in PATHEXT. Dropping the windows-latest leg would let the
#  same class back in.
#
#  The gateway suite (harness/gateway/test) is not here: it starts wrangler against a remote
#  connection and needs CLOUDFLARE_API_TOKEN, so it cannot run on a fork's pull request.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run the harness suite
        run: python -m unittest discover harness/test -v
